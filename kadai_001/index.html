<!DOCTYPE html>
<html lang="ja">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Myprofile</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
      <!--　ヘッダー　-->
      <header>
        <div class="header-inner"> 
      
          <!-- サイトタイトル -->
            <h1>Myprofile</h1>

          <!-- ナビゲーションメニュー -->
            <nav>
               <ul>
              <li><a href="#about">About</a></li>
              <li><a href="#works">Works</a></li>
               </ul>
            </nav>
        </div>
      </header>

       <!--　メイン　-->
       <main>

         <!--　メインビジュアル　-->
         <section class="main-visual">
            <img src="images/main.png" alt="カメラの写真">
         </section>

         <!--　aboutセクション　-->
         <section id="about">
            <h2>About</h2>
    <div class="about-inner">
              
         <!--　プロフィール画像　-->
         <img src="images/about.png"  alt="プロフィール写真"> 
         
         <!--　プロフィール文　-->
         <div class="about-text">
            <h3>kazuki Ashina</h3>
　　　　　　　　<ul>
                <li>25歳　長野県佐久市出身</li>
                <li>ソフトウェア業界でマーケティングに従事</li>
                <li>趣味はカメラ、愛機はCanon</li>
                <li>自然を撮影するのが好きで、海や山によく行く</li>
            </ul>
         </div>
    </div>
         </section>

         <!--　Worksセクション　-->
         <section id"="works">
            <h2>Works</h2>
         <div class="works-inner">

            <!--　作品１ -->
            <div class="works-item">
                <img src="images/works1.png" alt="海の写真">
                <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した１枚</p>
            </div>

            <!--　作品２　-->
            <div class="works-item">
                <img src="images/works2.png" alt="山の写真">
                <p>地元長野の木曽駒ヶ岳を撮影した、澄んだ空気を感じる１枚</p>
            </div>
            
            <!--　作品3　-->
            <div class="works-item">
                <img src="images/works3.png" alt="街並みの写真">
                <p>京都で撮影した、朝方のある街並みを切り取った１枚</p>
            </div>    
         </div> 
        </section>   

       </main>

       <!--　フッター　-->
       <footer>
        <p>© Myprofile All rights reserved.</p>
       </footer>
        
    </body>
</html>
